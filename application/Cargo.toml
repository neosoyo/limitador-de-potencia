[package]
name = "pm100-configurator"
version = "0.1.0"
edition = "2021"
authors = ["SBO"]
description = "App Desktop para configurar o PM100"

[dependencies]
# Dioxus desktop renderer (native webview window).
dioxus = { version = "0.7.10", features = ["desktop"] }

# Async traits and runtime utilities
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

# Serialization / Deserialization
serde = { version = "1.0", features = ["derive"] }

# Math & utilities for simulation/mocking
rand = "0.8"

# USB CDC ACM serial communication with the PM100.
serialport = "4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
