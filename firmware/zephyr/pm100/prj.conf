CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# Two CDC ACM instances are instantiated from the devicetree:
# board_cdc_acm_uart (console + shell + logs) and stream_cdc_acm_uart (binary
# telemetry stream, see boards/xiao_ble_nrf52840.overlay and src/stream.c).
#
# The ring buffer size is global, i.e. it applies to TX *and* RX of *both*
# instances: 2 x 2 x 4096 = 16 kB of RAM. It is deliberately much larger than
# the biggest frame (8 + 48*44 = 2120 bytes) so a whole frame is normally
# accepted by a single uart_fifo_fill() call and the stream stays contiguous.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_VT100_COLORS=y
CONFIG_SERIAL=y
CONFIG_PWM=y

# nrfx TIMER2 is used directly from src/control.c (GPIOTE -> PPI input capture),
# so CONFIG_NRFX_TIMER2 and CONFIG_NRFX_PPI must stay enabled.
# CONFIG_COUNTER must NOT be enabled: with the nRF timer nodes exposed to the
# devicetree the Zephyr counter driver binds to TIMER2/TIMER3 (it programs the
# same peripheral, owns CC0/CC1 and enables their IRQs) and conflicts with the
# raw nrfx use of TIMER2. Nothing in this application uses the counter API.
CONFIG_NRFX_TIMER2=y
CONFIG_NRFX_PPI=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_INA226=y
CONFIG_INA226_VSHUNT=y

CONFIG_SPI=y
CONFIG_LED_STRIP=y



CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PM100-PowerLimiter"
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_KEYS_SAVE_AGING_COUNTER_ON_PAIRING=y

# Configure BLE TX Power to the lowest possible level (-40 dBm)
CONFIG_BT_CTLR=y
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y
